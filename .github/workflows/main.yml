name: Build APK Fluu GX

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Cari dan ekstrak ZIP otomatis
        shell: bash
        run: |
          set -euo pipefail
          ROOT=""
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="$PWD"
            echo "Proyek sudah terekstrak di root repo."
          else
            ZIP="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            if [ -z "$ZIP" ]; then
              echo "::error::Tidak ada file .zip di repo."
              exit 1
            fi
            echo "ZIP ditemukan: $ZIP"
            unzip -tq "$ZIP"
            DEST="$RUNNER_TEMP/proyek"
            rm -rf "$DEST"; mkdir -p "$DEST"
            unzip -q -o "$ZIP" -x '__MACOSX/*' '*/.DS_Store' -d "$DEST"
            MANIFEST="$(find "$DEST" -type f -path '*/app/src/main/AndroidManifest.xml' | head -n1 || true)"
            if [ -z "$MANIFEST" ]; then
              echo "::error::Di dalam ZIP tidak ada app/src/main/AndroidManifest.xml."
              exit 1
            fi
            ROOT="$(dirname "$(dirname "$(dirname "$(dirname "$MANIFEST")")")")"
          fi

          if [ ! -f "$ROOT/settings.gradle.kts" ] && [ ! -f "$ROOT/settings.gradle" ]; then
            echo "settings.gradle.kts dibuatkan otomatis."
            cat > "$ROOT/settings.gradle.kts" <<'KTS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FluuGX"
          include(":app")
          KTS
          fi

          for f in build.gradle.kts app/build.gradle.kts; do
            if [ ! -f "$ROOT/$f" ]; then
              echo "::error::File $f tidak ditemukan di $ROOT"
              exit 1
            fi
          done

          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          ls -la "$ROOT"

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Pasang Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --console=plain --stacktrace

      - name: Ganti nama APK
        run: cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/FluuGX.apk"

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: FluuGX-APK
          path: ${{ runner.temp }}/FluuGX.apk
          if-no-files-found: error
