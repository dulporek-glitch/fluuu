name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Cek isi repo
        run: ls -la

      - name: Build APK
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FluuGX.apk

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: FluuGX-APK
          path: FluuGX.apk
          if-no-files-found: error
